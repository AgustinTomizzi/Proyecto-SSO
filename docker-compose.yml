# Las contraseñas salen de .env (copiar .env.example y cambiarlas).
# docker compose falla con un mensaje claro si falta alguna.

# Logs de Docker acotados (10 MB x 3 por servicio) para que no llenen el disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Base de datos MySQL (única, compartida: ProyectoEstela)
  mysql:
    image: mysql:8.0
    container_name: galisencia-mysql
    # Hora argentina para NOW()/CURDATE(). Offset fijo porque las tablas de
    # zonas con nombre todavía no existen al arrancar la inicialización.
    command: ["--default-time-zone=-03:00"]
    environment:
      TZ: America/Argentina/Buenos_Aires
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD en .env (ver .env.example)}
      MYSQL_DATABASE: ProyectoEstela
      # Usuario de la aplicación: lo crea db/00-usuario-app.sh en el primer arranque.
      DB_APP_USER: ${DB_APP_USER:-galileo_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Definí DB_APP_PASSWORD en .env (ver .env.example)}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - galisencia-network
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # Por TCP y con el usuario de la app: solo pasa cuando terminó la inicialización.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$DB_APP_USER\" -p\"$$DB_APP_PASSWORD\" -e 'SELECT 1' ProyectoEstela > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Backend PHP (Galileo_Auth) con la API JSON en /api. No publica puertos:
  # los frontends lo alcanzan por la red interna (nginx /api/).
  backend:
    build:
      context: ./Galisencia/Galileo_Auth
      dockerfile: Dockerfile
    # Sin container_name para poder escalar: docker compose up -d --scale backend=2
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - DB_HOST=mysql
      - DB_NAME=ProyectoEstela
      - DB_USER=${DB_APP_USER:-galileo_app}
      - DB_PASSWORD=${DB_APP_PASSWORD:?Definí DB_APP_PASSWORD en .env (ver .env.example)}
      # dev: CORS para localhost y cookie sin Secure. prod: exige HTTPS.
      - APP_ENV=${APP_ENV:-dev}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - SESSION_TIMEOUT_MINUTES=${SESSION_TIMEOUT_MINUTES:-30}
      # Sesiones en MySQL: permite más de una réplica del backend.
      - SESSION_STORE=db
      # Proveedor de autenticación (docs/AUTENTICACION.md).
      - AUTH_PROVIDER=${AUTH_PROVIDER:-local}
      # URL pública (arma el redirect_uri de OIDC) y proveedores institucionales.
      - APP_URL=${APP_URL:-http://localhost:${PROXY_PUERTO:-3000}}
      - OIDC_GOOGLE_CLIENT_ID=${OIDC_GOOGLE_CLIENT_ID:-}
      - OIDC_GOOGLE_CLIENT_SECRET=${OIDC_GOOGLE_CLIENT_SECRET:-}
      - OIDC_MICROSOFT_TENANT=${OIDC_MICROSOFT_TENANT:-}
      - OIDC_MICROSOFT_CLIENT_ID=${OIDC_MICROSOFT_CLIENT_ID:-}
      - OIDC_MICROSOFT_CLIENT_SECRET=${OIDC_MICROSOFT_CLIENT_SECRET:-}
      # Solo pruebas (perfil oidc-prueba); se ignora con APP_ENV=prod.
      - OIDC_PRUEBA_ISSUER=${OIDC_PRUEBA_ISSUER:-}
      - OIDC_PRUEBA_CLIENT_ID=${OIDC_PRUEBA_CLIENT_ID:-}
      - OIDC_PRUEBA_CLIENT_SECRET=${OIDC_PRUEBA_CLIENT_SECRET:-}
    # Solo lectura: el monitoreo (estado_sistema.php) lee el estado del último backup.
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - galisencia-network
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost/api/login.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Worker de notificaciones por email: misma imagen que el backend, corre
  # cli/enviar_notificaciones.php en bucle y envía la cola por SMTP. Por
  # defecto usa Mailpit (abajo); en producción, SMTP_* apuntan al servidor real.
  notificador:
    build:
      context: ./Galisencia/Galileo_Auth
      dockerfile: Dockerfile
    command: ["php", "/var/www/html/cli/enviar_notificaciones.php", "--loop"]
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - DB_HOST=mysql
      - DB_NAME=ProyectoEstela
      - DB_USER=${DB_APP_USER:-galileo_app}
      - DB_PASSWORD=${DB_APP_PASSWORD:?Definí DB_APP_PASSWORD en .env (ver .env.example)}
      - SMTP_HOST=${SMTP_HOST-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-none}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Galileo <no-responder@galileo.edu.ar>}
      - NOTIF_INTERVALO=${NOTIF_INTERVALO:-30}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - galisencia-network
    restart: unless-stopped
    logging: *logging

  # Backups diarios de la base (deploy/backup/respaldar.sh): mysqldump comprimido
  # en BACKUP_DIR (./backups), 14 diarios y 6 mensuales. Restaurar con
  # deploy/backup/restaurar.sh. Usa la misma imagen que la base (mysqldump igual).
  backup:
    image: mysql:8.0
    entrypoint: ["sh", "/respaldar.sh"]
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - DB_HOST=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD en .env (ver .env.example)}
      - BACKUP_HORA=${BACKUP_HORA:-03:00}
      - BACKUP_DIAS=${BACKUP_DIAS:-14}
      - BACKUP_MESES=${BACKUP_MESES:-6}
    volumes:
      - ./deploy/backup/respaldar.sh:/respaldar.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - galisencia-network
    restart: unless-stopped
    logging: *logging

  # Solo desarrollo: buzón de prueba. Todo lo que envía el notificador queda en
  # http://localhost:8025 (solo desde esta máquina) y no sale a Internet.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PUERTO:-8025}:8025"
    networks:
      - galisencia-network
    restart: unless-stopped
    logging: *logging

  # Solo pruebas: proveedor OIDC mínimo (tools/oidc-prueba) para probar el
  # ingreso institucional sin Internet. Activar con --profile oidc-prueba y
  # OIDC_PRUEBA_ISSUER=http://oidc-prueba:9100 en .env.
  oidc-prueba:
    image: node:22-alpine
    profiles: ["oidc-prueba"]
    command: ["node", "/app/servidor.mjs"]
    environment:
      - OIDC_ISSUER=http://oidc-prueba:9100
      - OIDC_PUBLICO=http://localhost:${OIDC_PRUEBA_PUERTO:-9100}
      - OIDC_CLIENT_ID=${OIDC_PRUEBA_CLIENT_ID:-galileo-pruebas}
      - OIDC_CLIENT_SECRET=${OIDC_PRUEBA_CLIENT_SECRET:-secreto-de-pruebas}
    volumes:
      - ./tools/oidc-prueba:/app:ro
    ports:
      - "127.0.0.1:${OIDC_PRUEBA_PUERTO:-9100}:9100"
    networks:
      - galisencia-network

  # Solo desarrollo: expone la API en http://localhost:8080 (por ejemplo para
  # `npm run dev` de Galiservas). Activar con: docker compose --profile dev up
  backend-dev-port:
    image: nginx:alpine
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8080:80"
    configs:
      - source: backend_dev_proxy
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - galisencia-network

  # Frontend Galisencia (build estático servido por nginx). Sin puerto propio:
  # se accede por el proxy en /.
  frontend:
    build:
      context: ./Galisencia/Frontend
      dockerfile: Dockerfile
    container_name: galisencia-frontend
    networks:
      - galisencia-network
    restart: unless-stopped
    logging: *logging

  # Frontend Galiservas, compilado con base /galiservas/. Sin puerto propio:
  # se accede por el proxy en /galiservas/.
  galiservas:
    build:
      context: ./Galiservas/Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_GALISENCIA_URL: /
    container_name: galiservas-frontend
    networks:
      - galisencia-network
    restart: unless-stopped
    logging: *logging

  # Único punto de entrada: / -> Galisencia, /galiservas/ -> Galiservas,
  # /api/ -> backend. Mismo origen para las dos apps, así la cookie de sesión
  # se comparte sin CORS. PROXY_MODO=https usa proxy/https.conf y los
  # certificados de TLS_CERT_DIR (fullchain.pem y privkey.pem).
  proxy:
    image: nginx:alpine
    container_name: galisencia-proxy
    ports:
      - "${PROXY_PUERTO:-3000}:80"
      - "${PROXY_PUERTO_HTTPS:-3443}:443"
    volumes:
      - ./proxy/${PROXY_MODO:-http}.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/rutas.inc:/etc/nginx/rutas.inc:ro
      - ${TLS_CERT_DIR:-./proxy/certs}:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      galiservas:
        condition: service_started
    networks:
      - galisencia-network
    restart: unless-stopped
    logging: *logging

configs:
  backend_dev_proxy:
    content: |
      server {
        listen 80;
        location / {
          proxy_pass http://backend:80;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        }
      }

networks:
  galisencia-network:
    driver: bridge

volumes:
  mysql_data:
