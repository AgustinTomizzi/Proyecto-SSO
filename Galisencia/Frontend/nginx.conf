# PWA: el service worker y el manifest no se guardan en caché del navegador,
# así una versión nueva de la app llega en la próxima visita.
map $uri $galisencia_cache {
    /sw.js                 "no-cache";
    default                "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # PWA: el manifest con su tipo (nginx no lo trae) y sin caché.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: todas las rutas no-api caen en index.html.
    # La API la sirve el proxy de entrada (proxy/); este nginx solo entrega la SPA.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control $galisencia_cache;
        # HSTS lo agrega el proxy de entrada cuando atiende HTTPS (proxy/https.conf).
        try_files $uri $uri/ /index.html;
    }
}
