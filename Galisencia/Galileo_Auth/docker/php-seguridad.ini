; Configuracion PHP del backend (se copia a conf.d en la imagen).

; Zona horaria unica del sistema (tambien en MySQL y frontend).
date.timezone = America/Argentina/Buenos_Aires
; cookie_secure se decide en includes/auth.php segun APP_ENV.

; Sesiones: en Docker se guardan en MySQL (SESSION_STORE=db, includes/sesiones.php);
; save_path solo se usa si el handler es el de archivos.
session.save_path = /tmp
session.cookie_path = /
session.cookie_httponly = 1
session.cookie_samesite = Lax
; Rechaza IDs de sesion que no emitio el servidor (fijacion de sesion).
session.use_strict_mode = 1
session.use_only_cookies = 1
; Alineado con el timeout por inactividad de 30 minutos.
session.gc_maxlifetime = 1800

; No revelar version ni errores al cliente.
expose_php = Off
display_errors = Off
log_errors = On

; Adjuntos de justificaciones: hasta 5 MB (el proxy acepta cuerpos de 6 MB).
upload_max_filesize = 5M
post_max_size = 6M
